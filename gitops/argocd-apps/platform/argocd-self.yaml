apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.9.2
    helm:
      releaseName: argocd
      values: |
        configs:
          params:
            server.insecure: true
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            hostname: argocd.localhost
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        repoServer:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        redis-ha:
          enabled: false
        notifications:
          enabled: false
        dex:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
