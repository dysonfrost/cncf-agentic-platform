apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/dysonfrost/cncf-agentic-platform.git
    targetRevision: main
    path: agents
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
