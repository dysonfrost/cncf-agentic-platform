# Linux-only: requires ROCm and /dev/kfd, /dev/dri.
# On macOS, install Ollama natively (Metal backend).

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:?VIDEO_GID not set, run 'make ollama-env'}"
      - "${RENDER_GID:?RENDER_GID not set, run 'make ollama-env'}"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=1   # Only one model in VRAM at a time
      - OLLAMA_KEEP_ALIVE=30m        # Keep the model loaded 30 min after use
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 8G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ollama-models:
