apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cncf-agentic-platform
image: rancher/k3s:v1.31.5-k3s1
servers: 1
agents: 2
options:
  k3s:
    extraArgs:
      - arg: "--kubelet-arg=max-pods=50"
        nodeFilters:
          - server:*
          - agent:*
  runtime:
    serversMemory: "1024MiB"
    agentsMemory: "1024MiB"
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
