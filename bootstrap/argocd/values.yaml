# Minimal Argo CD values for a local k3d lab on 8 GiB.

configs:
  params:
    server.insecure: true

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
  resources:
    requests:
      cpu: 60m
      memory: 128Mi

repoServer:
  resources:
    requests:
      cpu: 60m
      memory: 128Mi

redis-ha:
  enabled: false

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false
