configs:
  params:
    server.insecure: true
    # Augmente le timeout du health check du repo-server
    reposerver.parallelism.limit: "0"

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    initialDelaySeconds: 30
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    initialDelaySeconds: 15

redis-ha:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false
